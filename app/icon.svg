<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="415 407 370 370">

    <!--
      The brand mark, at tab size. Team-specified 2026-08-17: the mark itself is
      unchanged from the supplied artwork — same ring, same horizon, same
      geometry, same gradients. Do not redraw it to suit small sizes.

      Two things are different from the supplied file, and only these two:

        1. No background. It ships transparent, so it sits on the tab strip
           rather than in a dark chip that reads as a square at a glance.

        2. The viewBox is cropped to the mark instead of the full 1200 artboard.
           The supplied artboard leaves the mark occupying about a quarter of
           the square, which at a 16px favicon put the ring's 25-unit stroke
           below a third of a pixel — antialiasing then spread it across two
           pixels at half opacity and it read as a smudge. Cropping to
           415 407 370 370 centres the square on the ring and leaves an even
           ~29-unit margin on all four sides, which takes the same stroke to
           about 1.1px at 16px. The paths below are untouched; only the window
           onto them moved.

      The horizon runs out through the left and right edges at this crop, which
      is correct — a horizon is a line that carries on past the frame.

      Raster versions of this file (favicon.ico, the touch icon, the manifest
      icons) are generated FROM it. Change this and re-run the generator; see
      docs/BRAND-ASSETS.md.
    -->

    <defs>

        <!-- Sun -->
        <linearGradient id="sunGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%" stop-color="#FFCB5C"/>
            <stop offset="32%" stop-color="#FFCB5C"/>
            <stop offset="66%" stop-color="#F86A43"/>
            <stop offset="100%" stop-color="#B13848"/>
        </linearGradient>

        <!-- Horizon -->
        <linearGradient id="horizonGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="0%">
            <stop offset="0%" stop-color="#B13848"/>
            <stop offset="38%" stop-color="#F86A43"/>
            <stop offset="50%" stop-color="#FF884F"/>
            <stop offset="62%" stop-color="#F86A43"/>
            <stop offset="100%" stop-color="#B13848"/>
        </linearGradient>

        <mask id="sun-mask">
            <rect width="1200" height="1200" fill="white"/>

            <path
                d="
                    M205 778
                    C355 730 515 705 600 705
                    C685 705 845 730 995 778
                    L1200 1200
                    L0 1200
                    Z"
                fill="black"/>
        </mask>

    </defs>

    <!-- Horizon -->
    <path
        d="
            M205 778
            C355 730 515 705 600 705
            C685 705 845 730 995 778
            C865 752 725 738 600 738
            C475 738 335 752 205 778
            Z"
        fill="url(#horizonGradient)"/>

    <!-- Sun -->
    <path
        mask="url(#sun-mask)"
        d="
            M600 435
            A155 155 0 1 1 600 745
            A155 155 0 1 1 600 435

            M600 460
            A130 130 0 1 0 600 720
            A130 130 0 1 0 600 460
            Z"
        fill="url(#sunGradient)"
        fill-rule="evenodd"/>

</svg>
