<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100">

    <!--
      Purpose-drawn tab icon. NOT a crop of the lockup.

      The lockup in public/brand/ is ~2.3:1 — wide and flat. Fitting all of it
      into a square necessarily leaves the ring small, and the ring's stroke
      then renders below one device pixel at a 16px favicon, where antialiasing
      halves its opacity and it reads as a smudge rather than as our mark. That
      is a property of the aspect ratio, so no amount of reframing fixes it.

      This is the same idea — sun on a horizon, same gradients, same warm ramp —
      redrawn square-first on a 100-unit grid so the strokes clear a whole pixel:
      the ring is 11 units (~1.8px at 16px) and the horizon 8.5 at its thickest
      (~1.4px). The horizon runs off both edges, which reads as continuing past
      the frame and lets the sun sit larger than a contained version allows.

      The lockup is untouched and is still what BrandMark and every other
      surface uses. This file is only ever the tab icon.

      An alternative — ring alone, no horizon — is in docs/ for comparison; see
      the pull request. If that one is chosen, its contents replace this file
      and the docs copy is deleted.
    -->

    <defs>

        <!-- Sun -->
        <linearGradient id="sunGradient"
                        x1="0" y1="0"
                        x2="0" y2="1">
            <stop offset="0%" stop-color="#FFCB5C"/>
            <stop offset="32%" stop-color="#FFCB5C"/>
            <stop offset="66%" stop-color="#F86A43"/>
            <stop offset="100%" stop-color="#B13848"/>
        </linearGradient>

        <!-- Horizon -->
        <linearGradient id="horizonGradient"
                        x1="0" y1="0"
                        x2="1" y2="0">
            <stop offset="0%" stop-color="#B13848"/>
            <stop offset="38%" stop-color="#F86A43"/>
            <stop offset="50%" stop-color="#FF884F"/>
            <stop offset="62%" stop-color="#F86A43"/>
            <stop offset="100%" stop-color="#B13848"/>
        </linearGradient>

        <!-- Hides the part of the sun that has dipped below the horizon -->
        <mask id="sun-mask">
            <rect width="100" height="100" fill="#fff"/>

            <path
                d="
                    M0 74
                    C25 68 38 64.5 50 64.5
                    C62 64.5 75 68 100 74
                    L100 100
                    L0 100
                    Z"
                fill="#000"/>
        </mask>

    </defs>

    <!-- Horizon -->
    <path
        d="
            M0 74
            C25 68 38 64.5 50 64.5
            C62 64.5 75 68 100 74
            L100 81
            C75 75.5 62 73 50 73
            C38 73 25 75.5 0 81
            Z"
        fill="url(#horizonGradient)"/>

    <!-- Sun -->
    <path
        mask="url(#sun-mask)"
        fill-rule="evenodd"
        fill="url(#sunGradient)"
        d="
            M50 12
            A30 30 0 1 1 50 72
            A30 30 0 1 1 50 12

            M50 23
            A19 19 0 1 0 50 61
            A19 19 0 1 0 50 23
            Z"/>

</svg>
